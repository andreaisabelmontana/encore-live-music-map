name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, data, tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and current LTS.
        node: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate seed data
        run: npm run validate:data

      - name: Unit tests
        run: npm test
